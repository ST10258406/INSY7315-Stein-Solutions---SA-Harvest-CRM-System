services:
  postgres:
    image: postgres:16
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: crmdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: crm-azurite
    restart: unless-stopped
    ports:
      - "10000:10000" # Blob service
    volumes:
      - azurite-data:/data
    # --skipApiVersionCheck: the Azure.Storage.Blobs SDK version we're pinned to
    # sends a newer x-ms-version header than this Azurite image recognizes yet;
    # this flag is Microsoft's documented workaround (Azurite otherwise rejects
    # the request with "API version ... is not supported").
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"

  crm-api:
    build:
      context: .
      dockerfile: src/CRM.API/Dockerfile
    container_name: crm-api
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      Azure__BlobStorage__ConnectionString: ${AZURE_STORAGE_CONNECTION_STRING}
      Azure__BlobStorage__ContainerName: donor-documents
      AZURE_KEY_VAULT_URI: ${AZURE_KEY_VAULT_URI}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@crm.local}
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

  crm-web:
    image: node:26-alpine
    container_name: crm-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
    volumes:
      - ./src/CRM.Web:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-5000}

volumes:
  postgres-data:
  azurite-data: