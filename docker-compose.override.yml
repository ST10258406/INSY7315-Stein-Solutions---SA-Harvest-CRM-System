services:
  crm-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # appsettings.Development.json is excluded from the image (.dockerignore), so supply its dev values here.
      Cors__AllowedOrigins__0: http://localhost:3000
      Frontend__BaseUrl: http://localhost:3000
      Auth__RefreshCookie__Secure: "false"
    volumes:
      - ./src/CRM.API:/src/src/CRM.API

  postgres:
    ports:
      # exposed to host for local DB tools (pgAdmin, DBeaver, etc.). Override
      # POSTGRES_HOST_PORT in your local .env if 5432 is already taken on your machine.
      - "${POSTGRES_HOST_PORT:-5432}:5432"