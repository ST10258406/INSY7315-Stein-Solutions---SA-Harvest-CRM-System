name: Frontend CI

on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/CRM.Web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ./src/CRM.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build