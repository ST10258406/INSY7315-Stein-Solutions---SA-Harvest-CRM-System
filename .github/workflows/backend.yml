name: Backend CI

on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]

jobs:
  build-and-test:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: P@ss1234ID
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CRM.slnx

      - name: Build solution
        run: dotnet build CRM.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test CRM.slnx --no-build --configuration Release --verbosity normal