name: Backend CI

on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CRM.slnx

      - name: Build solution
        run: dotnet build CRM.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test CRM.slnx --no-build --configuration Release --verbosity normal